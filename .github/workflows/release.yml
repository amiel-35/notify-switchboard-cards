name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Check bundle size budget
        run: npm run size

      - name: Extract release notes from CHANGELOG.md
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { found=1; capture=1; next }
            capture && /^## / { capture=0 }
            capture { print }
            END { exit(found ? 0 : 1) }
          ' CHANGELOG.md > release_notes.md; then
            echo "::error::CHANGELOG.md has no '## [$VERSION]' section for tag $GITHUB_REF_NAME. Add one before tagging."
            exit 1
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          # The bundle ships with a sourcemap comment; attach the map too so
          # a stack trace from a user's browser stays readable.
          files: |
            dist/notify-switchboard-cards.js
            dist/notify-switchboard-cards.js.map
          body_path: release_notes.md
